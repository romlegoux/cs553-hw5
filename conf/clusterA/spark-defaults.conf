# Default system properties included when running spark-submit.
# This is useful for setting default environmental settings.

# Example:
# spark.master                     spark://master:7077
# spark.eventLog.enabled           true
# spark.eventLog.dir               hdfs://namenode:8021/directory
# spark.serializer                 org.apache.spark.serializer.KryoSerializer
# spark.driver.memory              5g
# spark.executor.extraJavaOptions  -XX:+PrintGCDetails -Dkey=value -Dnumbers="one two three"
# Exécuter sur YARN
spark.master                      yarn

# Journaux d'événements (pour le history server, et preuves pour le rapport)
spark.eventLog.enabled            true
spark.eventLog.dir                hdfs://tiny:9000/spark-logs
spark.history.fs.logDirectory     hdfs://tiny:9000/spark-logs
spark.yarn.historyServer.address  tiny:18080

# Executors : 2 par worker, 4 cœurs et 5 Go chacun → 16 executors, 64 cœurs
spark.executor.instances          16
spark.executor.cores              4
spark.executor.memory             5g



spark.yarn.archive                hdfs://tiny:9000/spark-jars/spark-libs.jar
